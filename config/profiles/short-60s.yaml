# ================================================================
# profile:60 秒竖屏短视频
# ================================================================
# 用法:
#     python pipeline.py --profile short-60s
#
# 叠加顺序: base.yaml → 本文件 → --set
# profile 只写"要改的项",没写的项沿用 base.yaml。
# ================================================================

select:
  # 短视频时长
  target_seconds: 60
  # 竖屏通常不需要慢放,直接原速更耐看
  speed: 1.0

encode:
  # 竖屏 1080x1920
  scale: "1080:1920"
  # 竖屏 30fps 足够
  fps: 30
  gop: 60
  # 短视频体积可以大一点,画质优先
  cq: 20
  maxrate: "8000k"
  bufsize: "16000k"

mix:
  # 短视频用 AAC 128k 足够
  audio_bitrate: "128k"

music:
  # 短视频淡入淡出更短
  fade_in: 0.5
  fade_out: 1

wechat:
  enabled: false
