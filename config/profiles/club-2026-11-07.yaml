# ================================================================
# profile:龙泽俱乐部 2026-11-07(3号场)
# ================================================================
# 用法:
#     python pipeline.py --profile club-2026-11-07
#
# 叠加顺序: base.yaml → 本文件 → --set
# 只写与 base 不同的部分;技术参数全部继承 base.yaml。
# ================================================================

source_dir: "D:/羽毛球视频/俱乐部日常活动/11月7日"

clips:
  # key 用于中间产物命名,必须在所有场次间唯一
  # name 决定成片文件名 —— 带日期后缀,避免与 10月31日 / 11月1日 那批同名被覆盖
  - key: c3
    name: "3号场_龙泽_1107_羽毛球集锦"
    file: "20261107_龙泽_3号场.mp4"

# 本批素材实测规格(ffprobe):
#   4833.30s / 5.32GB / HEVC 1920x1080 / r_frame_rate=60 但
#   avg_frame_rate=1150372067/19167853 → VFR 变帧率,与 10月31日/11月1日 同源
#   音频 AAC 48kHz 256kbps
# → 编码/拼接沿用 base 的 fps 滤镜 + concat filter 方案,此处不改 base 的语义


# ---- 击球瞬态检测:本批放宽阈值 ----
# base 的阈值(上升沿 6dB / 偏移 8dB / 绝对门 -32dB)是 10月31日 那批定的,
# 从没被标注集验证过。拿本批 20 分钟的精标注集(eval/ground_truth/c3_1200-2400.json,
# 90 个回合,含检测器完全漏掉的)复测 —— tools/sweep_params.py:
#
#   变体            命中   回合  最长  ≥30拍   P      R     F1   完整回合率
#   base(基线)     2790   543   28     0    0.264  0.422  0.325    0.429
#   rise4/off6     5422   514   65    26    0.433  0.611  0.507    0.864
#   ★ rise5/off6   4688   552   57    13    0.389  0.622  0.479    1.000
#   rise5/off7     3823   567   37     4    0.336  0.556  0.418    0.800
#
# 根因:基线把**真实回合切开了** —— 漏掉一两拍就会在回合内部留下 >1.6s 的空档,
# 聚类把这个回合切成两段(完整回合率只有 0.429,片段常切在回合中间)。
# 放宽上升沿与自适应阈值偏移能显著改善召回与完整性。
#
# 为什么不用 F1 更高的 rise4/off6:它把两三个回合连成一个 60+ 拍的"长回合"
# (画面上大量时间球员是站着的,不是连续对打),拍数虚高会让"≥30 拍"的口径失真。
# rise5/off6 在召回(0.622,最高)、完整性(1.000)、拍数可信度上更均衡。
analysis:
  # 聚类口径(决定回合边界):要"不切碎"。阈值太严 → 漏掉几拍 → 回合内部出现
  # >rally_max_gap 的空档 → 一个真实回合被切成好几段 → 拍数被低估。
  # 用 B 组参数(rise4.0/off6.0/thr-34):实测能把 13 条长回合全部还原成完整一段。
  hit_thresh_db: -34.0        # 绝对门放宽 2dB
  hit_median_offset_db: 6.0   # 自适应阈值偏移 8→6
  hit_rise_db: 4.0            # 上升沿判定 6→4dB(补回被漏掉的击球)
  # 计数口径(决定拍数):要"数得准"。B 组会把两三个回合连成 60+ 拍(虚高 1.29x),
  # 用 G 组(rise4.5/off7.0/thr-34):对照独立拍数真值,MAE 3.73、虚高 1.01x。
  # 两组都只在 profile 层,base.yaml 保持原值 ⇒ 10/31、11/01 归档基线不受影响。
  count_hit_thresh_db: -34.0
  count_hit_median_offset_db: 7.0
  count_hit_rise_db: 4.5
  # ---- 主球场限定(口径 A/B:只数主球场的连续对打)----
  # 运动能量只统计前景这片场地。几何实测(Chief 494s 原帧 work/sheets/probe_494.jpg
  # + 执行员 1220.1s 原帧 work/sheets/probe_grid.jpg,均带坐标网格):
  #   网带 y≈550-575;粉色网柱 x≈380 与 x≈1540(柱脚落地 y≈840);
  #   近半场 y 840-1080,远半场 y 690-840;左右外侧与画面上方是背景场地。
  # → 取 x 280-1680 / y 480-1080:框住主球场两个半场与球网,排除左右相邻场地。
  # ⚠️ 抽帧验证(Chief 抽帧 work/chief_review/frame_1985.png、frame_600.png):
  #   **相邻场地在画面的左右缘**(x≲280 与 x≳1680),中间背景才是墙面与长椅 ——
  #   不是"背景场地根本不在画面内"。固定 crop 只能近似框住主球场:
  #   网柱在 494s 是 x≈380/1540,1985s 是 x≈170/1660(镜头会平移)。
  #   ROI 门控只能判断"主球场此刻是否在动";画外/邻场击球声在同一条混音里,
  #   要分离得用**局部**判据(候选时刻 ROI 运动能量 vs 该区间 ±2s 的局部中位基线)。
  #   非回合区间的剔除另靠 select.exclude_intervals(人工闸门,数据源=负样本 GT)。
  motion_roi: "crop=1400:600:280:480"
  # 画面-音频共现门控:只有此刻主球场正在剧烈运动(ROI 运动峰值 ≥ 全片该分位)
  # 才认这一拍。背景场地的击球没有主球场运动伴随,于是被挡掉。
  # percentile=0 表示不门控(与原行为一致)。
  # ⚠️ 窗口取 0.3s(Chief 要求 0.25~0.35):窗口太大会让背景场地那一拍
  #   被主球场稍晚一点的运动"佐证"通过(446-483 那段主球场本来就在动)。
  # 分位 80:分位扫描(tools/gate_sweep.py,window=0.3)实测 ——
  #   9 条真长回合的 shots 在 70 分位是 22/10/20/18/14/24/22/14/19,
  #   在 80 分位是 15/7/17/14/8/22/16/10/16(与人工逐拍的 13/16/11/10/6/18/6/16/18
  #   最接近,合计虚高比 1.09x、MAE 5.0);5 条负样本在 50 分位起就全部 <30。
  #   ⚠️ 没有任何单一分位能同时做到「9 条长回合都 >=30 拍」与「5 条负样本都 <30」——
  #   原理上做不到:446-483 那段主球场当时确实在动,ROI 门控压不掉它(见报告第三节)。
  shot_gate_percentile: 80.0
  shot_gate_window: 0.3
  # ---- 回合合并 ----
  # 把间隔 <= 该值的相邻片段接回一个回合(捡球/换发球的空档会多切一刀)。
  # 0 = 不合并(与原行为一致);base 的 rally_max_gap=1.6 保持不动。
  # ⚠️ 实测对照(tools/gate_sweep.py --merge-gap):
  #   gap=2.5  段数 514→246,最长段 166 拍,9 条长回合**全部**被并成跨真实间隙的段
  #             (22.4-135.6 / 1346.3-1418.6 / 3436.7-3511.1 / 437.4-531.2 连两条负样本一起吞)
  #             —— 正是 Chief 否决 rally_max_gap 1.6→2.5 的原因,否决。
  #   gap=1.0  段数 514→514(0 段被合并),最长段 65 拍,9 条长回合没有一条跨真实间隙 ✅
  # ⚠️ 1.0 < rally_max_gap=1.6 ⇒ 合并实际是**空操作**:聚类已把 ≤1.6s 的空档接上了。
  #   它的作用是守住"合并间隔不得超过聚类间隔"这条底线 —— 要真合并就得 >1.6,
  #   而 >1.6 必然跨真实回合间隙(见上)。门控生效后 9 条长回合已各自是完整一段,也不需要合并。
  rally_merge_gap: 1.0


# ---- 长回合保障 ----
# 需求:≥30 拍的长回合必须出现在成片里 —— base 保留用户原始口径 30,不动。
# ⚠️ 不要再把本批阈值下调到 20:"本批不存在 ≥30 拍回合"是**检测器切碎回合造成的假象**。
# 修正检测器后本批实测 13 个 ≥30 拍回合,逐个用「音频包络条 + 6 帧联系表」目视核验过,
# 全部在成片里(见 docs/执行报告.md 第四节)。按 20 拍验收等于把 10 个真长回合漏在片外。
select:
  long_rally_force: true
  long_rally_shots: 30
  # ---- 人工闸门:显式排除的非回合区间 ----
  # 数据源:eval/ground_truth/c3_negative_rallies.json(人工逐帧判定的 5 条 is_rally:false)。
  # 为什么需要人工闸门:抽帧验证显示背景 4~5 片场地**根本不在画面里**
  # (相邻场地在画面左右缘 x≲280 / x≳1680,中间背景是墙面长椅),ROI 运动门控只能判断
  # 「主球场此刻是否在动」,挡不住邻场混进音轨的击球声 ——
  # 446.9-483.4 / 493.4-520.2 这两段主球场当时确在动(单人挥拍练习同样有运动能量),
  # 画外场地的击球声又混在同一条音轨里无法用画面分离 —— 算法压不掉,只能显式排除。
  # 裁定 docs/裁定_非回合剔除与ROI门控返工.md §三 明文授权此兜底路径。
  # tests/test_reel.py 有断言:本列表必须与负样本 GT 的区间逐条一致(可审计)。
  exclude_intervals:
    - [446.9, 483.4]
    - [493.4, 520.2]
    - [563.9, 584.6]
    - [1067.3, 1099.2]
    - [1102.2, 1130.9]

# 评测层的长回合判定阈值必须与 select 保持一致(否则 R4 的口径与成片口径脱节)
eval:
  long_rally_shots: 30


# ---- 标注窗口(评估集) ----
# 规则(事先声明,避免挑好看的时段):
#   1) 普通窗口:从第 20 分钟起取连续 20 分钟(base 的 annotation.window)。
#   2) 长回合专窗:取能覆盖该批**全部** ≥N 拍回合的最小时间跨度,两端各留
#      annotation.context_seconds 上下文,与普通窗口首尾相接、不重叠。
#      详见 docs/标注规范.md 第八节 8.2。
#
# ⚠️ 本批的标注是在**基线检测配置**的候选表上做的(该配置的检测会把回合切碎,
#    人工核验时因此额外补了空档扫描漏检的回合),所以窗口跨度按基线口径的
#    长回合分布取:[559.0, 3039.1]。修正检测器后本批 ≥30 拍回合的跨度变成
#    [29.1, 4467.6](近全片),改用「长回合专集」覆盖
#    (eval/ground_truth/c3_long_rallies.json,scope=recall)。
#    标注记的是画面事实,与用哪套检测器无关,所以两个窗口集可以并存。
annotation:
  window:
    - [559.0, 1200.0]     # 长回合专窗 · 前段
    - [1200.0, 2400.0]    # 普通窗口(base 规则:第 20 分钟起连续 20 分钟)
    - [2400.0, 3039.1]    # 长回合专窗 · 后段
