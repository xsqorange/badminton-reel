# ================================================================
# profile:快速试跑
# ================================================================
# 用法:
#     python pipeline.py --profile rehearsal
#
# 目的:验证流程是否通,不做画质考量。
# 分辨率/帧率/码率全部压到最低,几分钟内出片。
# 注意:产出不可用于发布,只是跑通链路。
# ================================================================

select:
  # 只要 30 秒,够看清切点是否对齐
  target_seconds: 30
  speed: 1.0

encode:
  scale: "640:360"
  fps: 24
  gop: 48
  cq: 30
  maxrate: "1200k"
  bufsize: "2400k"
  x264_preset: "ultrafast"

analysis:
  # 试跑时提高采样率换取速度(精度下降但快得多)
  motion_sample_fps: 2

wechat:
  enabled: false
